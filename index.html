<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estatísticas da Equipa Master</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Segoe UI',Arial,sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(255,255,255,.15),
      transparent 55%
    ),
    radial-gradient(
      circle at 50% 110%,
      rgba(0,0,0,.55),
      transparent 60%
    ),
    linear-gradient(
      135deg,
      #08745b,
      #075846 45%,
      #064c3d
    );

  color:#f8fafc;
  padding:18px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;

  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.012) 0px,
      rgba(255,255,255,.012) 1px,
      transparent 1px,
      transparent 4px
    );

  pointer-events:none;
}

/* =========================
   CABEÇALHO
========================= */

.header{
  max-width:950px;
  margin:25px auto 30px auto;
  text-align:center;
}

.bola8{
  width:70px;
  height:70px;

  margin:0 auto 15px;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(
      circle at 35% 25%,
      #475569,
      #020617 55%,
      #000
    );

  border-radius:50%;

  box-shadow:
    0 10px 25px rgba(0,0,0,.55),
    0 0 25px rgba(250,204,21,.15);
}

.numero8{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f8fafc;
  color:#020617;

  border-radius:50%;

  font-size:18px;
  font-weight:900;
}

h1{
  margin:0;

  color:#facc15;

  font-size:32px;
  letter-spacing:1.5px;

  text-shadow:
    0 3px 10px rgba(0,0,0,.7),
    0 0 20px rgba(250,204,21,.15);
}

.subtitulo{
  margin-top:8px;
  color:#cbd5e1;
  font-size:14px;
}

/* =========================
   LOGIN
========================= */

#adminBtn{
  position:fixed;
  top:12px;
  right:12px;

  z-index:999;

  border:1px solid rgba(255,255,255,.15);

  background:rgba(2,6,23,.35);
  color:#cbd5e1;

  width:40px;
  height:40px;

  border-radius:50%;

  cursor:pointer;

  backdrop-filter:blur(8px);

  font-size:16px;
}

#estadoOperador{
  display:none;

  max-width:950px;
  margin:-15px auto 20px;

  padding:10px;

  text-align:center;

  color:#86efac;

  background:rgba(34,197,94,.10);

  border:1px solid rgba(34,197,94,.25);

  border-radius:10px;

  font-size:13px;
}

/* =========================
   CARD
========================= */

.card{
  max-width:950px;
  margin:0 auto 25px;

  background:
    linear-gradient(
      145deg,
      rgba(15,23,42,.88),
      rgba(15,23,42,.72)
    );

  border-radius:18px;

  border:1px solid rgba(250,204,21,.18);

  box-shadow:
    0 18px 45px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.04);

  overflow:hidden;

  backdrop-filter:blur(12px);
}

.card-header{
  padding:18px 20px;

  border-bottom:
    1px solid rgba(255,255,255,.06);

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-header h2{
  margin:0;
  font-size:20px;
}

.atualizacao{
  font-size:12px;
  color:#94a3b8;
}

/* =========================
   TABELA
========================= */

.tabela-container{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th{
  padding:14px 10px;

  background:#020617;

  color:#facc15;

  font-size:13px;
  font-weight:700;

  text-align:center;

  border-bottom:
    1px solid rgba(250,204,21,.15);
}

td{
  padding:14px 10px;

  text-align:center;

  border-bottom:
    1px solid rgba(255,255,255,.045);

  font-size:14px;
}

tbody tr{
  transition:.2s;
}

tbody tr:hover{
  background:rgba(255,255,255,.025);
}

.posicao{
  color:#94a3b8;
  font-weight:700;
}

.nome{
  font-weight:600;
  text-align:left;
}

.total{
  font-weight:800;
}

.ganhas{
  color:#86efac;
  font-weight:700;
}

.perdidas{
  color:#fca5a5;
  font-weight:700;
}

.percentagem{
  font-weight:800;
  color:#facc15;
}

/* =========================
   INPUTS
========================= */

input[type="number"]{
  width:68px;

  padding:8px 5px;

  text-align:center;

  background:#1e293b;

  color:white;

  border:1px solid #475569;

  border-radius:7px;

  font-size:16px;

  font-weight:700;
}

input[type="number"]:focus{
  outline:none;

  border-color:#facc15;

  box-shadow:
    0 0 0 2px rgba(250,204,21,.15);
}

/* =========================
   BARRA
========================= */

.barra{
  width:100%;
  min-width:70px;

  height:5px;

  margin-top:6px;

  background:#1e293b;

  border-radius:20px;

  overflow:hidden;
}

.barra-preenchida{
  height:100%;

  background:
    linear-gradient(
      90deg,
      #16a34a,
      #86efac
    );

  border-radius:20px;

  transition:width .25s ease;
}

/* =========================
   BOTÃO GUARDAR
========================= */

#guardarBtn{
  display:none;

  margin:20px auto 12px;

  padding:12px 28px;

  border:none;

  border-radius:9px;

  background:#facc15;

  color:#111827;

  font-weight:800;

  font-size:14px;

  cursor:pointer;

  box-shadow:
    0 5px 15px rgba(250,204,21,.2);
}

#guardarBtn:hover{
  background:#fde047;
}

/* =========================
   MENSAGEM
========================= */

#mensagem{
  text-align:center;

  font-size:13px;

  min-height:24px;

  margin:8px 10px 15px;
}

.sucesso{
  color:#86efac;
}

.erro{
  color:#fca5a5;
}

/* =========================
   LEGENDA
========================= */

.legenda{
  max-width:950px;

  margin:15px auto;

  text-align:center;

  color:#94a3b8;

  font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  body{
    padding:10px;
  }

  .header{
    margin-top:25px;
  }

  h1{
    font-size:23px;
  }

  .bola8{
    width:58px;
    height:58px;
  }

  .numero8{
    width:26px;
    height:26px;
    font-size:15px;
  }

  .card{
    border-radius:14px;
  }

  .card-header{
    padding:15px;
  }

  td,th{
    padding:11px 7px;
    font-size:12px;
  }

  input[type="number"]{
    width:62px;
    font-size:16px;
  }

}

</style>
</head>

<body>

<button id="adminBtn" onclick="login()">⚙️</button>

<div class="header">

  <div class="bola8">
    <div class="numero8">8</div>
  </div>

  <h1>ESTATÍSTICAS DA EQUIPA</h1>

  <div class="subtitulo">
    Bilhar • Estatísticas individuais
  </div>

</div>

<div id="estadoOperador">
  ⚙️ Modo operador ativo — podes alterar as estatísticas
</div>

<div class="card">

  <div class="card-header">

    <h2>🎱 Jogadores</h2>

    <span class="atualizacao">
      Estatísticas
    </span>

  </div>

  <div class="tabela-container">

    <table>

      <thead>

        <tr>

          <th>#</th>

          <th style="text-align:left">
            Jogador
          </th>

          <th>PT</th>

          <th>PG</th>

          <th>PP</th>

          <th>% Vitórias</th>

        </tr>

      </thead>

      <tbody id="tabelaJogadores"></tbody>

    </table>

  </div>

  <button
    id="guardarBtn"
    onclick="guardar()">
    GUARDAR ALTERAÇÕES
  </button>

  <div id="mensagem"></div>

</div>

<div class="legenda">
  PT = Partidas Totais &nbsp; • &nbsp;
  PG = Partidas Ganhas &nbsp; • &nbsp;
  PP = Partidas Perdidas
</div>

<script>

/* =====================================
   CONFIGURAÇÃO
===================================== */

const PASSWORD = "1234";

let editavel = false;
let dados = {};
let db = null;


/* =====================================
   JOGADORES
===================================== */

const jogadores = [
  "Rosas",
  "Nelson",
  "P Magalhães",
  "N Oliveira",
  "F Pinto",
  "F Duarte",
];


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyCH2x07uqd8f9Move6duv4NYCEx3SKacjQ",

  authDomain:
    "liga-verao-salaoeuropa.firebaseapp.com",

  databaseURL:
    "https://liga-verao-salaoeuropa-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "liga-verao-salaoeuropa"

};


try{

  firebase.initializeApp(firebaseConfig);

  db = firebase.database();

  db.ref("estatisticas_equipa").on(

    "value",

    snapshot => {

      dados = snapshot.val() || {};

      /*
       Só redesenha automaticamente se
       NÃO estivermos a editar.

       Isto impede o Firebase de reconstruir
       os inputs enquanto estás a escrever.
      */

      if(!editavel){
        render();
      }

    },

    erro => {

      console.error(
        "Erro ao carregar Firebase:",
        erro
      );

      render();

    }

  );

}
catch(erro){

  console.error(
    "Erro Firebase:",
    erro
  );

  render();

}


/* =====================================
   LOGIN
===================================== */

function login(){

  if(editavel){

    editavel = false;

    document
      .getElementById("estadoOperador")
      .style.display = "none";

    document
      .getElementById("guardarBtn")
      .style.display = "none";

    render();

    return;

  }


  const tentativa =
    prompt("Código operador:");


  if(tentativa === PASSWORD){

    editavel = true;

    document
      .getElementById("estadoOperador")
      .style.display = "block";

    document
      .getElementById("guardarBtn")
      .style.display = "block";

    render();

  }

  else if(tentativa !== null){

    alert("Código errado");

  }

}


/* =====================================
   SEGURANÇA TEXTO
===================================== */

function escaparHTML(texto){

  return String(texto)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================
   NÚMEROS
===================================== */

function numeroSeguro(valor){

  if(
    valor === "" ||
    valor === null ||
    valor === undefined
  ){
    return 0;
  }

  const numero = Number(valor);

  if(
    Number.isNaN(numero) ||
    numero < 0
  ){
    return 0;
  }

  return Math.floor(numero);

}


/* =====================================
   RENDER PRINCIPAL
===================================== */

function render(){

  const tbody =
    document.getElementById(
      "tabelaJogadores"
    );

  if(!tbody) return;

  let html = "";


  jogadores.forEach(
    (jogador,index)=>{

      const registo =
        dados[jogador] || {};


      const ganhas =
        numeroSeguro(
          registo.ganhas
        );


      const perdidas =
        numeroSeguro(
          registo.perdidas
        );


      const total =
        ganhas + perdidas;


      const percentagem =
        total > 0
        ? (ganhas / total) * 100
        : 0;


      html += `

      <tr data-linha-jogador="${escaparHTML(jogador)}">

        <td class="posicao">
          ${index + 1}
        </td>


        <td class="nome">
          ${escaparHTML(jogador)}
        </td>


        <td
          class="total"
          data-total="${escaparHTML(jogador)}">

          ${total}

        </td>


        <td class="ganhas">

          ${
            editavel

            ? `
              <input
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                data-jogador="${escaparHTML(jogador)}"
                data-tipo="ganhas"
                value="${ganhas}"
                oninput="atualizarLinha(this)"
              >
            `

            : ganhas
          }

        </td>


        <td class="perdidas">

          ${
            editavel

            ? `
              <input
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                data-jogador="${escaparHTML(jogador)}"
                data-tipo="perdidas"
                value="${perdidas}"
                oninput="atualizarLinha(this)"
              >
            `

            : perdidas
          }

        </td>


        <td
          class="percentagem"
          data-percentagem="${escaparHTML(jogador)}">

          <span class="valor-percentagem">

            ${percentagem
              .toFixed(1)
              .replace(".",",")}%

          </span>


          <div class="barra">

            <div
              class="barra-preenchida"
              style="width:${percentagem}%">
            </div>

          </div>

        </td>

      </tr>

      `;

    }
  );


  tbody.innerHTML = html;

}


/* =====================================
   ATUALIZAÇÃO SEM PERDER FOCO
===================================== */

function atualizarLinha(input){

  const linha =
    input.closest("tr");


  if(!linha){
    return;
  }


  const jogador =
    input.dataset.jogador;


  const inputGanhas =
    linha.querySelector(
      '[data-tipo="ganhas"]'
    );


  const inputPerdidas =
    linha.querySelector(
      '[data-tipo="perdidas"]'
    );


  /*
    Aqui NÃO fazemos render().
    Apenas lemos os dois campos da linha.
  */

  const ganhas =
    numeroSeguro(
      inputGanhas.value
    );


  const perdidas =
    numeroSeguro(
      inputPerdidas.value
    );


  const total =
    ganhas + perdidas;


  const percentagem =
    total > 0
    ? (ganhas / total) * 100
    : 0;


  /*
    Atualiza os dados locais.
  */

  if(!dados[jogador]){

    dados[jogador] = {
      ganhas:0,
      perdidas:0
    };

  }


  dados[jogador].ganhas =
    ganhas;


  dados[jogador].perdidas =
    perdidas;


  /*
    Atualiza apenas PT.
  */

  const totalElemento =
    linha.querySelector(
      ".total"
    );


  if(totalElemento){

    totalElemento.textContent =
      total;

  }


  /*
    Atualiza apenas a percentagem.
  */

  const percentagemElemento =
    linha.querySelector(
      ".valor-percentagem"
    );


  if(percentagemElemento){

    percentagemElemento.textContent =
      percentagem
        .toFixed(1)
        .replace(".",",")
      + "%";

  }


  /*
    Atualiza apenas a barra.
  */

  const barra =
    linha.querySelector(
      ".barra-preenchida"
    );


  if(barra){

    barra.style.width =
      percentagem + "%";

  }

}


/* =====================================
   GUARDAR
===================================== */

function guardar(){

  if(!editavel){
    return;
  }


  /*
    Lê TODOS os inputs uma última vez
    antes de enviar para o Firebase.
  */

  document
    .querySelectorAll(
      'input[type="number"][data-jogador]'
    )
    .forEach(input=>{

      const jogador =
        input.dataset.jogador;


      const tipo =
        input.dataset.tipo;


      if(!dados[jogador]){

        dados[jogador] = {
          ganhas:0,
          perdidas:0
        };

      }


      dados[jogador][tipo] =
        numeroSeguro(
          input.value
        );

    });


  if(!db){

    mostrarMensagem(
      "Não foi possível ligar à base de dados.",
      false
    );

    return;

  }


  mostrarMensagem(
    "A guardar...",
    true
  );


  db.ref("estatisticas_equipa")

    .set(dados)

    .then(()=>{

      mostrarMensagem(
        "✓ Estatísticas guardadas com sucesso.",
        true
      );

      /*
        Não fazemos render aqui.
        Assim os inputs continuam estáveis.
      */

    })

    .catch(erro=>{

      console.error(
        "Erro ao guardar:",
        erro
      );


      mostrarMensagem(
        "Erro ao guardar as estatísticas.",
        false
      );

    });

}


/* =====================================
   MENSAGENS
===================================== */

function mostrarMensagem(
  texto,
  sucesso
){

  const elemento =
    document.getElementById(
      "mensagem"
    );


  elemento.textContent =
    texto;


  elemento.className =
    sucesso
    ? "sucesso"
    : "erro";


  if(texto !== "A guardar..."){

    setTimeout(()=>{

      elemento.textContent = "";

      elemento.className = "";

    },3000);

  }

}


/* =====================================
   PRIMEIRO RENDER
===================================== */

/*
  Faz com que a tabela apareça mesmo
  enquanto o Firebase está a carregar.
*/

render();

</script>

</body>
</html>
